[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siphon"
version = "0.1.0"
description = "Self-hosted YouTube-to-podcast bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2026.8.19",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0",
    # faster-whisper requires av>=11 with no upper bound, but av 19 dropped the
    # metadata_errors option that faster_whisper.audio.decode_audio passes to av.open,
    # so every transcription fails with a TypeError. Remove once faster-whisper handles av 19.
    "av>=11,<19",
    "httpx>=0.27",
    "pystray>=0.19",
    "Pillow>=10.0",
    "psutil>=5.9",        # diagnostics: process memory / handle / thread counts
    "nvidia-ml-py>=12.0",  # diagnostics: GPU VRAM usage (best-effort, no-op without NVIDIA)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "freezegun>=1.2",
]

[project.scripts]
siphon = "siphon.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
